# Render.com 一键部署（Blueprint）
# 用法：dashboard.render.com → New → Blueprint → 选择本仓库 → Apply
services:
  - type: web
    name: hotboard
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
